title = "SalesMaker gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented placeholders and prose-only docs"
paths = [
  # Local-dev placeholder values, never real secrets.
  '''\.env\.example$''',
  # The phase table's prose ("REST API + API keys, matching/…") trips generic-api-key.
  '''docs/phases/ROADMAP\.md$''',
]

name: ci

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build i18n:check
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: terraform · fmt · validate · tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # Validates the environment and, through it, every module. Nothing is planned or applied.
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/envs/staging-eu-central-1
      - run: terraform validate
        working-directory: infra/terraform/envs/staging-eu-central-1
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"

  db:
    name: db · migrate · rls-audit · drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN: postgresql://postgres:postgres@localhost:5432
      CELL_DATABASE_URL_MIGRATOR: postgresql://sm_migrator:sm_migrator_dev@localhost:5432/salesmaker_cell
      CELL_SHADOW_DATABASE_URL: postgresql://sm_migrator:sm_migrator_dev@localhost:5432/sm_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start the project Postgres image (all §3.2 extensions)
        run: |
          docker build -t sm-postgres infra/docker/postgres
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 sm-postgres
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker exec pg psql -U postgres -c 'CREATE DATABASE sm_shadow'
      - name: Bootstrap roles and extensions
        run: |
          CELL_ADMIN_DATABASE_URL=$ADMIN/salesmaker_cell pnpm --filter @sm/db db:bootstrap
          CELL_ADMIN_DATABASE_URL=$ADMIN/sm_shadow pnpm --filter @sm/db db:bootstrap
          docker exec pg psql -U postgres -d salesmaker_cell -Atc "SELECT extname FROM pg_extension ORDER BY 1"
      - run: pnpm turbo run build --filter=@sm/db
      - name: Apply migrations as sm_migrator
        run: pnpm --filter @sm/db db:migrate
      - name: db:rls-audit
        run: pnpm --filter @sm/db db:rls-audit
      - name: Prisma schema matches the migrations (drift)
        run: pnpm --filter @sm/db db:schema-drift

  e2e:
    name: e2e · exit-gate journeys (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres (project image), Valkey and Mailpit
        run: docker compose up -d --wait postgres valkey mailpit
      - run: pnpm setup:dev
      - run: pnpm db:setup
      - run: pnpm turbo run build
      - name: Start fakes, control-api, api and web
        run: |
          (cd apps/fakes && nohup node --env-file=../../.env dist/main.js > ../../fakes.log 2>&1 &)
          (cd apps/control-api && nohup node --env-file=../../.env dist/main.js > ../../control-api.log 2>&1 &)
          (cd apps/api && nohup node --env-file=../../.env dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && CONTROL_API_BASE_URL=http://localhost:4100 WEB_BASE_DOMAIN=localhost:3000 \
            WEB_URL_SCHEME=http nohup pnpm start > ../../web.log 2>&1 &)
          for url in localhost:4200/health localhost:4100/health localhost:4000/health localhost:3000/api/health; do
            for i in $(seq 1 60); do curl -sf "http://$url" > /dev/null && break; sleep 1; done
            curl -sf "http://$url" > /dev/null || { echo "$url did not come up"; exit 1; }
          done
      - run: pnpm --filter @sm/web exec playwright install --with-deps chromium
      - name: Journeys and accessibility (blocking)
        run: E2E_SKIP_VISUAL=1 pnpm --filter @sm/web test:e2e --shard=${{ matrix.shard }}/2
      - name: Visual comparison (reviewed diffs, non-blocking)
        continue-on-error: true
        run: pnpm --filter @sm/web test:e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            *.log
          retention-days: 14

  storybook:
    name: storybook · axe (blocking) · visual (review)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sm/ui... build
      - run: pnpm --filter @sm/ui build-storybook
      - run: pnpm --filter @sm/ui exec playwright install --with-deps chromium
      - name: Accessibility (axe, serious/critical fail the build)
        run: SKIP_VISUAL=1 pnpm --filter @sm/ui test:stories
      - name: Visual comparison (reviewed diffs, non-blocking)
        continue-on-error: true
        run: pnpm --filter @sm/ui test:stories
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: packages/ui/storybook-static

  storybook-pages:
    name: publish Storybook
    if: github.ref == 'refs/heads/main'
    needs: storybook
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

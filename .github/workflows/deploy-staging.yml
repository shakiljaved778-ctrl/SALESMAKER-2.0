name: deploy-staging

# Deploys a commit to staging (docs/runbooks/deploy.md): build and push arm64 images, migrate
# (expand only), roll the services, smoke. Manual only until staging has been applied; it does
# nothing without the repository variables below (Settings → Environments → staging).
#
#   AWS_DEPLOY_ROLE_ARN   IAM role trusted for this repository through GitHub OIDC
#   AWS_ACCOUNT_ID        Account that holds the ECR repositories (eu-central-1)
#   CELL_API_URL          https URL of the cell API         (smoke test)
#   CONTROL_API_URL       https URL of the control plane    (smoke test)
#
# The web app deploys through Vercel's Git integration (ADR-0003), after this has finished.

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First deploy only — create the cell's database roles before migrating
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  CELL_CLUSTER: sm-staging-eu-central-1
  CP_CLUSTER: sm-staging-cp

jobs:
  guard:
    name: configured?
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && [ -n "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Staging is not configured (AWS_DEPLOY_ROLE_ARN, AWS_ACCOUNT_ID); nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: image · ${{ matrix.target }}
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    strategy:
      matrix:
        target: [api, worker, control-api, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (immutable tag = commit)
        run: |
          repo="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/salesmaker/${{ matrix.target }}"
          if [ "${{ matrix.target }}" = migrate ]; then args="--target migrate"; else args="--target app --build-arg APP=${{ matrix.target }}"; fi
          docker buildx build -f infra/docker/app/Dockerfile $args --platform linux/arm64 \
            --cache-from type=gha,scope=deploy-${{ matrix.target }} \
            --cache-to type=gha,mode=max,scope=deploy-${{ matrix.target }} \
            --provenance=false --push -t "$repo:${GITHUB_SHA}" .

  deploy:
    name: migrate · roll · smoke
    needs: [guard, images]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Images
        run: echo "REGISTRY=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/salesmaker" >> "$GITHUB_ENV"
      # Control plane first: cells call it, and its migrations are expand-only too.
      - name: Migrate control plane
        run: infra/deploy/ecs.sh migrate "$CP_CLUSTER" "$CP_CLUSTER-migrate" "$REGISTRY/migrate:$GITHUB_SHA" control-api control-plane
      - name: Roll control plane
        run: infra/deploy/ecs.sh roll "$CP_CLUSTER" control-api "$REGISTRY/control-api:$GITHUB_SHA"
      - name: Bootstrap cell database
        if: inputs.bootstrap
        run: infra/deploy/ecs.sh migrate "$CELL_CLUSTER" "$CELL_CLUSTER-migrate" "$REGISTRY/migrate:$GITHUB_SHA" api bootstrap-cell
      - name: Migrate cell
        run: infra/deploy/ecs.sh migrate "$CELL_CLUSTER" "$CELL_CLUSTER-migrate" "$REGISTRY/migrate:$GITHUB_SHA" api cell
      - name: Roll cell
        run: |
          infra/deploy/ecs.sh roll "$CELL_CLUSTER" api "$REGISTRY/api:$GITHUB_SHA"
          infra/deploy/ecs.sh roll "$CELL_CLUSTER" worker "$REGISTRY/worker:$GITHUB_SHA"
      - name: Smoke
        if: vars.CELL_API_URL != '' && vars.CONTROL_API_URL != ''
        run: |
          for url in "${{ vars.CONTROL_API_URL }}/health/ready" "${{ vars.CELL_API_URL }}/health/ready"; do
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$url" && echo "ok $url"
          done

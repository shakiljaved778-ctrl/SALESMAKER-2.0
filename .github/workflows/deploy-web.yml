name: deploy-web

# Deploys apps/web to Vercel production (ADR-0003; docs/runbooks/deploy.md, "Web on Vercel").
# Production goes out only through this workflow, after the APIs it calls are deployed and
# healthy: vercel.json turns off Vercel's own deploys of main (preview deploys of other
# branches stay on). Runs after a successful deploy-staging, or by hand; a no-op until the
# Vercel settings below exist (Settings → Environments → production).
#
#   secret VERCEL_TOKEN        Vercel access token scoped to the team
#   var    VERCEL_ORG_ID       Team id   (from `vercel link`, .vercel/project.json)
#   var    VERCEL_PROJECT_ID   Project id
#   var    WEB_URL             e.g. https://salesmaker.app (smoke test)

on:
  workflow_run:
    workflows: [deploy-staging]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: vercel · production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Configured?
        id: check
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel is not configured (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID); nothing deployed."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          # The commit deploy-staging shipped, so web and APIs match.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Build here with the project's production settings and env, then upload the output.
      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: |
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(npx --yes vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke
        if: steps.check.outputs.ready == 'true' && vars.WEB_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${{ vars.WEB_URL }}/api/health"
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null "${{ vars.WEB_URL }}/"
          echo "ok ${{ vars.WEB_URL }}"
